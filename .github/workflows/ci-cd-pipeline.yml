name: Supply Chain AI MLOps Pipeline

# Trigger this workflow whenever code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up the pipeline by caching dependencies

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🐳 Build Docker Image
      run: |
        docker build -t supply-chain-agent:latest .
        
    - name: ✅ Verification Complete
      run: echo "Container built successfully! Ready for Kubernetes/Cloud Deployment."
      